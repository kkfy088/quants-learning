<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>量化分析师成长之路 — 供应链预测实战教程</title>
<style>
:root {
  --bg:#fafbfc;--card-bg:#fff;--text:#1a1a2e;--text2:#555;--border:#e2e4e9;
  --accent:#2563eb;--accent-lt:#dbeafe;--cue-bg:#f0f4ff;--summary-bg:#fff7ed;
  --success:#059669;--warn:#d97706;--danger:#dc2626;--purple:#7c3aed;--pink:#ec4899;
  --shadow:0 1px 3px rgba(0,0,0,.06);--radius:8px;
  --mono:'SF Mono','Fira Code','Consolas',monospace;
  --sans:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);background:var(--bg);color:var(--text);line-height:1.7;height:100vh;overflow:hidden;display:flex;flex-direction:column}
.header{background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 12px;height:46px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:10;gap:8px}
.header-left{display:flex;align-items:center;gap:6px}
.hl-icon{font-size:16px}.hl-title{font-size:12px;font-weight:700}.hl-sub{font-size:10px;color:var(--text2)}
.header-right{display:flex;align-items:center;gap:6px}
.day-badge{background:var(--accent-lt);color:var(--accent);font-size:9px;font-weight:600;padding:2px 7px;border-radius:8px}
.prog-wrap{width:80px;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--accent);border-radius:2px;transition:width .4s}
.btn{padding:4px 8px;border:1px solid var(--border);border-radius:5px;background:var(--card-bg);color:var(--text);cursor:pointer;font-size:10px;font-family:var(--sans);transition:all .15s;white-space:nowrap}
.btn:hover{background:#f3f4f6}
.btn-a{background:var(--accent);color:#fff;border-color:var(--accent)}.btn-a:hover{background:#1d4ed8}
.btn-r{background:#fef2f2;color:var(--danger);border-color:#fecaca}.btn-r:hover{background:#fee2e2}
.btn-g{background:#f0fdf4;color:var(--success);border-color:#bbf7d0}.btn-g:hover{background:#dcfce7}
.track-tabs{display:flex;gap:3px;margin:0 8px}
.track-tab{padding:4px 10px;border-radius:5px;font-size:10px;font-weight:600;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--text2);font-family:var(--sans)}
.track-tab.active{background:var(--accent);color:#fff}.track-tab:hover:not(.active){background:#f3f4f6}

.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:185px;flex-shrink:0;background:var(--card-bg);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.side-hdr{padding:8px 12px;font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;border-bottom:1px solid var(--border)}
.wk-grp{margin:2px 0}
.wk-lbl{padding:4px 12px;font-size:9px;font-weight:700;color:var(--purple);background:#faf5ff;border-bottom:1px solid #ede9fe}
.day-it{padding:6px 12px;font-size:11px;cursor:pointer;border-bottom:1px solid #f5f5f5;display:flex;align-items:center;gap:5px;transition:all .12s;color:var(--text2)}
.day-it:hover{background:#f8f9fb;color:var(--text)}
.day-it.active{background:var(--accent-lt);color:var(--accent);font-weight:600;border-right:3px solid var(--accent)}
.day-it .day-n{width:18px;height:18px;background:var(--border);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;flex-shrink:0}
.day-it.active .day-n{background:var(--accent);color:#fff}
.day-it .day-ck{font-size:12px;opacity:.4;margin-left:auto}.day-it.done .day-ck{opacity:1;color:var(--success)}

.content-area{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.cornell{padding:14px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.day-hdr{padding-bottom:6px;border-bottom:2px solid var(--border)}
.day-hdr h2{font-size:16px;font-weight:700}
.day-hdr .meta{font-size:10px;color:var(--text2);margin-top:2px;display:flex;gap:8px;flex-wrap:wrap}
.cornell-main{display:flex;gap:14px;flex:1;min-height:0}
.cue-col{width:180px;flex-shrink:0;display:flex;flex-direction:column;gap:5px}
.cue-label{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase}
.cue-list{background:var(--cue-bg);border:1px solid #d4dbf0;border-radius:var(--radius);padding:8px;flex:1;overflow-y:auto;font-size:10px;line-height:1.9}
.cue-item{padding:1px 0;color:var(--text2);cursor:pointer}.cue-item:hover{color:var(--accent)}.cue-item::before{content:"▸ ";color:var(--accent);font-size:8px}
.cue-iw{border-top:1px solid #d4dbf0;padding-top:5px}
.cue-iw textarea{width:100%;border:1px dashed var(--border);border-radius:3px;padding:5px;font-size:10px;font-family:var(--sans);resize:vertical;background:#fff;min-height:40px}
.cue-iw textarea:focus{outline:none;border-color:var(--accent);border-style:solid}
.notes-col{flex:1;overflow-y:auto;padding-right:4px}
.notes{font-size:12px;line-height:1.8}
.notes h3{font-size:14px;font-weight:700;margin:14px 0 5px;padding-bottom:2px;border-bottom:1px solid var(--border);color:var(--accent)}
.notes h4{font-size:12px;font-weight:600;margin:10px 0 3px}
.notes p{margin:5px 0}.notes ul,.notes ol{margin:3px 0 3px 16px}.notes li{margin:2px 0}
.notes blockquote{border-left:3px solid var(--accent);padding:5px 10px;margin:6px 0;background:var(--accent-lt);border-radius:0 var(--radius) var(--radius) 0;font-size:11px;color:var(--text2)}
.notes table{width:100%;border-collapse:collapse;margin:6px 0;font-size:11px}
.notes th{background:#f3f4f6;padding:5px 7px;text-align:left;font-weight:600;border:1px solid var(--border)}
.notes td{padding:5px 7px;border:1px solid var(--border)}.notes tr:nth-child(even){background:#fafbfc}
.notes code{background:#f1f5f9;padding:1px 3px;border-radius:2px;font-family:var(--mono);font-size:10px;color:#d946ef}
.notes pre{background:#1e293b;color:#e2e8f0;padding:8px 10px;border-radius:6px;overflow-x:auto;font-size:10px;line-height:1.45;margin:6px 0;position:relative}
.notes pre code{background:none;color:inherit;padding:0;font-size:inherit}
.cpy-btn{position:absolute;top:3px;right:5px;background:#334155;color:#cbd5e1;border:none;border-radius:3px;padding:1px 6px;font-size:8px;cursor:pointer}
.cpy-btn:hover{background:#475569}
.ex-box{background:#fefce8;border:1px solid #fde68a;border-radius:var(--radius);padding:10px 14px;margin:10px 0}
.ex-box h4{color:var(--warn);margin:0 0 4px}
.bk-box{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:var(--radius);padding:10px 14px;margin:10px 0}
.bk-box h4{color:var(--success);margin:0 0 4px}
.rs-box{background:#faf5ff;border:1px solid #e9d5ff;border-radius:var(--radius);padding:10px 14px;margin:10px 0}
.rs-box h4{color:var(--purple);margin:0 0 4px}
.pit-box{background:#fef2f2;border:1px solid #fecaca;border-radius:var(--radius);padding:10px 14px;margin:10px 0}
.pit-box h4{color:var(--danger);margin:0 0 4px}
.quiz-box{background:#eff6ff;border:1px solid #bfdbfe;border-radius:var(--radius);padding:12px 16px;margin:12px 0;display:none}
.quiz-box h4{color:var(--accent);margin:0 0 6px}
.quiz-q{margin:6px 0;font-weight:600}
.quiz-opt{padding:4px 8px;margin:2px 4px;border:1px solid var(--border);border-radius:4px;cursor:pointer;font-size:11px;display:inline-block;background:#fff;transition:all .15s}
.quiz-opt:hover{background:var(--accent-lt)}
.quiz-opt.correct{background:#dcfce7;border-color:#86efac}
.quiz-opt.wrong{background:#fee2e2;border-color:#fca5a5}
.quiz-fb{font-size:10px;margin-top:4px;display:none}
.notes a{color:var(--accent);text-decoration:none}.notes a:hover{text-decoration:underline}
.key-pt{display:inline-block;background:var(--accent-lt);color:var(--accent);padding:1px 4px;border-radius:2px;font-size:10px;font-weight:600;margin:0 1px}
.mini-d{background:#f8f9fb;border:1px solid var(--border);border-radius:var(--radius);padding:8px;margin:6px 0;font-family:var(--mono);font-size:9px;white-space:pre;overflow-x:auto;line-height:1.35;color:var(--text2)}

.summary-area{border-top:2px solid var(--border);padding-top:6px}
.summary-label{font-size:9px;font-weight:700;color:var(--text2);text-transform:uppercase;margin-bottom:3px}
.summary-area textarea{width:100%;border:1px dashed var(--border);border-radius:var(--radius);padding:6px 10px;font-size:11px;font-family:var(--sans);resize:vertical;min-height:36px;background:var(--summary-bg)}
.summary-area textarea:focus{outline:none;border-color:var(--warn);border-style:solid}

.ai-panel{width:300px;flex-shrink:0;background:var(--card-bg);border-left:1px solid var(--border);display:flex;flex-direction:column}
.ai-hdr{padding:8px 10px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.ai-title{font-size:11px;font-weight:700;display:flex;align-items:center;gap:4px}
.ai-model{font-size:8px;color:var(--text2);background:var(--border);padding:1px 4px;border-radius:4px}
.ai-setup{padding:14px 10px;text-align:center;display:none}
.ai-setup h4{font-size:12px;margin-bottom:4px}.ai-setup p{font-size:10px;color:var(--text2);margin-bottom:6px;line-height:1.4}
.ai-setup input{width:100%;padding:5px 7px;border:1px solid var(--border);border-radius:5px;font-size:10px;font-family:var(--mono);margin-bottom:4px}
.ai-setup .hint{font-size:8px;color:var(--text2);margin-top:3px}
.ai-msgs{flex:1;overflow-y:auto;padding:8px;display:flex;flex-direction:column;gap:5px}
.ai-msg{max-width:86%;padding:5px 8px;border-radius:7px;font-size:10px;line-height:1.55;word-wrap:break-word}
.ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:2px}
.ai-msg.assistant{align-self:flex-start;background:#f3f4f6;color:var(--text);border-bottom-left-radius:2px}
.ai-msg.assistant pre{background:#1e293b;color:#e2e8f0;padding:5px 7px;border-radius:3px;font-size:9px;overflow-x:auto;margin:3px 0}
.msg-time{font-size:7px;opacity:.5;margin-top:1px}
.ai-iw{border-top:1px solid var(--border);padding:6px 10px;display:flex;gap:3px}
.ai-iw textarea{flex:1;border:1px solid var(--border);border-radius:5px;padding:5px 7px;font-size:10px;font-family:var(--sans);resize:none;height:30px;max-height:60px}
.ai-iw textarea:focus{outline:none;border-color:var(--accent)}
.ai-typing{font-size:9px;color:var(--text2);padding:2px 10px;font-style:italic;display:none}

.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:100}
.modal-box{background:var(--card-bg);border-radius:12px;padding:20px;max-width:700px;width:92%;max-height:80vh;overflow-y:auto;box-shadow:0 8px 30px rgba(0,0,0,.12)}
.modal-box h3{font-size:16px;margin-bottom:10px}.modal-box h4{font-size:13px;margin:12px 0 4px;color:var(--accent)}
.modal-box p,.modal-box li{font-size:11px;line-height:1.6}
.modal-box .res-cat{margin:8px 0;padding:8px 12px;background:#f8f9fb;border-radius:6px}
.modal-box .res-link{display:inline-block;margin:2px 0;font-size:11px;color:var(--accent);text-decoration:none}
.modal-box .res-link:hover{text-decoration:underline}
.modal-box .streak{font-size:22px;text-align:center;margin:6px 0}
.modal-tabs{display:flex;gap:4px;margin-bottom:10px;flex-wrap:wrap}
.modal-tab{padding:4px 10px;border-radius:4px;font-size:10px;cursor:pointer;border:1px solid var(--border);background:var(--card-bg)}
.modal-tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-tab-content{display:none}.modal-tab-content.active{display:block}

.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1e293b;color:#fff;padding:7px 14px;border-radius:14px;font-size:11px;z-index:200;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}

@media(max-width:900px){.sidebar{display:none}.ai-panel{width:100%;height:220px;border-left:none;border-top:1px solid var(--border)}.cornell-main{flex-direction:column}.cue-col{width:100%}.main{flex-direction:column}}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:2px}
@keyframes dd{0%,20%{opacity:0}50%{opacity:1}100%{opacity:0}}
.dots span{animation:dd 1.4s infinite;font-size:14px}.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
</style>
</head>
<body>

<div class="header">
  <div class="header-left"><span class="hl-icon">📊</span><span class="hl-title">量化→供应链</span><span class="hl-sub">从零到量化分析师·双轨修炼</span></div>
  <div class="track-tabs">
    <button class="track-tab active" id="tabCrash" onclick="switchTrack('crash')">⚡5天速成</button>
    <button class="track-tab" id="tabDeep" onclick="switchTrack('deep')">📅100天修炼</button>
  </div>
  <div class="header-right">
    <button class="btn btn-g" onclick="showResources()">📚 资源宝库</button>
    <button class="btn" onclick="showCheatsheet()">📋 速查表</button>
    <span class="day-badge" id="dayBadge">📅 Day 1</span>
    <div class="prog-wrap"><div class="prog-fill" id="progBar" style="width:0%"></div></div>
    <span style="font-size:9px;color:var(--text2)" id="progText">0/5</span>
    <button class="btn btn-sm" onclick="resetProgress()">🔄</button>
    <button class="btn btn-sm" onclick="exportNotes()">📥</button>
  </div>
</div>

<div class="main">
  <div class="sidebar" id="sidebar"></div>
  <div class="content-area">
    <div class="cornell">
      <div class="day-hdr"><h2 id="dayTitle"></h2><div class="meta" id="dayMeta"></div></div>
      <div class="cornell-main">
        <div class="cue-col">
          <div class="cue-label">🔑 线索/提问</div>
          <div class="cue-list" id="cueList"></div>
          <div class="cue-iw"><textarea id="cueInput" placeholder="写下疑问或关键提示词..."></textarea><button class="btn btn-sm" onclick="saveCue()" style="margin-top:3px">+ 保存</button></div>
        </div>
        <div class="notes-col" id="notesCol"><div class="notes" id="notesBody"></div></div>
      </div>
      <div class="summary-area">
        <div class="summary-label">📝 今日总结</div>
        <textarea id="summaryInput" placeholder="今天我学到了..."></textarea>
        <div style="display:flex;gap:4px;margin-top:4px;justify-content:flex-end">
          <button class="btn btn-sm" onclick="saveSummary()">💾 保存</button>
          <button class="btn btn-sm" onclick="toggleQuiz()">🧠 自测</button>
          <button class="btn btn-sm btn-a" onclick="markDone()">✅ 完成今日</button>
        </div>
        <div class="quiz-box" id="quizBox"></div>
      </div>
    </div>
  </div>

  <div class="ai-panel">
    <div class="ai-hdr"><span class="ai-title">🤖 AI助手<span class="ai-model">V4-Pro Max</span><span id="aiLockStatus" style="font-size:8px;margin-left:4px"></span></span><div style="display:flex;gap:3px"><button class="btn btn-sm btn-r" id="btnLock" onclick="lockApiKey()" style="display:none;font-size:8px">🔒锁定</button><button class="btn btn-sm" onclick="toggleAiSetup()">⚙️</button></div></div>
    <div class="ai-setup" id="aiSetup">
      <h4 id="aiSetupTitle">🔐 配置 DeepSeek API</h4>
      <p>在 <a href="https://platform.deepseek.com/api_keys" target="_blank" style="color:var(--accent)">platform.deepseek.com</a> 创建 Key</p>
      <div id="aiSetupNew">
        <input type="password" id="apiKeyInput" placeholder="粘贴 API Key：sk-xxxxxxxx" style="margin-bottom:4px">
        <input type="password" id="apiPwdInput" placeholder="设置一个解锁密码（≥6位，用于加密保护Key）">
        <button class="btn btn-a" onclick="saveApiKeyEncrypted()" style="width:100%;margin-top:4px">🔒 加密保存</button>
        <div class="hint">Key 将用 AES-GCM 加密后存储，密码不保存。符合 CSDN 推荐的安全方案。</div>
      </div>
      <div id="aiSetupUnlock" style="display:none">
        <p style="color:var(--warn);font-weight:600">🔒 API Key 已加密存储，需要密码解锁</p>
        <input type="password" id="apiUnlockInput" placeholder="输入解锁密码">
        <button class="btn btn-a" onclick="unlockApiKey()" style="width:100%;margin-top:4px">🔓 解锁</button>
        <button class="btn btn-r" onclick="resetApiKey()" style="width:100%;margin-top:2px;font-size:9px">🗑 清除并重新配置</button>
        <div class="hint">密码错误 5 次将锁定 15 分钟（防暴力破解）</div>
      </div>
    </div>
    <div class="ai-msgs" id="aiMsgs"><div class="ai-msg assistant">你好！选左侧线索直接提问，或输入任何学习相关的问题 🎯</div></div>
    <div class="ai-typing" id="aiTyping">思考中<span class="dots"><span>.</span><span>.</span><span>.</span></span></div>
    <div class="ai-iw"><textarea id="aiInput" placeholder="提问..." onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendAi()}"></textarea><button class="btn btn-a" onclick="sendAi()">发送</button></div>
  </div>
</div>

<!-- RESOURCES MODAL -->
<div class="modal-overlay" id="resModal">
  <div class="modal-box" id="resModalBox">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0">📚 量化 + 供应链 学习资源宝库</h3>
      <button class="btn btn-r btn-sm" onclick="closeResources()">✕</button>
    </div>
    <div class="modal-tabs" id="resTabs"></div>
    <div id="resContent"></div>
  </div>
</div>

<!-- CHEATSHEET MODAL -->
<div class="modal-overlay" id="csModal">
  <div class="modal-box">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
      <h3 style="margin:0">📋 速查表</h3>
      <button class="btn btn-r btn-sm" onclick="document.getElementById('csModal').style.display='none'">✕</button>
    </div>
    <div class="modal-tabs" id="csTabs"></div>
    <div id="csContent"></div>
  </div>
</div>

<!-- DAILY MODAL -->
<div class="modal-overlay" id="dailyModal">
  <div class="modal-box" style="max-width:380px"><h3>🌅 继续修炼！</h3><div class="streak">🔥 <span id="streakCount">1</span> 天</div><p id="modalMsg"></p><button class="btn btn-a" onclick="closeModal()" style="width:100%;margin-top:6px">开始今天 →</button></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// GLOBAL RESOURCES (curated directory)
// ============================================================
const GLOBAL_RESOURCES = {
  "📊 数据集": [
    {name:"M5 Forecasting Competition (Kaggle)",url:"https://www.kaggle.com/c/m5-forecasting-accuracy",desc:"Walmart 销售数据，42,840个时序——最权威的零售预测竞赛"},
    {name:"Favorita Store Sales (Kaggle)",url:"https://www.kaggle.com/c/store-sales-time-series-forecasting",desc:"厄瓜多尔连锁店 5 年日销数据，含促销/油价/节假日"},
    {name:"Rossmann Store Sales (Kaggle)",url:"https://www.kaggle.com/c/rossmann-store-sales",desc:"德国药妆店 1,115 家门店日销，经典特征工程案例"},
    {name:"UCI Online Retail Dataset",url:"https://archive.ics.uci.edu/ml/datasets/online+retail",desc:"英国在线零售商交易记录，含退货、国家、单价"},
    {name:"UCI Supermarket Sales",url:"https://archive.ics.uci.edu/ml/datasets/Sales_Transactions_Dataset_Weekly",desc:"52周 × 811种商品的周销量，经典聚类+预测"},
    {name:"中国政府开放数据",url:"https://data.stats.gov.cn/",desc:"国家统计局公开数据：CPI、社零、GDP等宏观指标"},
  ],
  "💻 GitHub仓库": [
    {name:"microsoft/RD-Agent",url:"https://github.com/microsoft/RD-Agent",desc:"微软亚研院因子自动挖掘框架，假设→代码→回测闭环 ★必看"},
    {name:"microsoft/qlib",url:"https://github.com/microsoft/qlib",desc:"微软量化投资AI平台，含数据、模型、回测、执行全流程"},
    {name:"TradingAgents",url:"https://github.com/TauricResearch/TradingAgents",desc:"UCLA+MIT多智能体投研框架，7万+星，角色分工+辩论"},

   content:`
<h3>3.1 时间序列 ≠ 普通数据</h3>
<p><span class="key-pt">时序数据的核心特点：今天的数据和昨天、上周、去年同期都有关联。</span>这是好事（信息在时间结构里）也是挑战（不能随机打乱数据）。</p>

<h3>3.2 ARIMA 三步走</h3>
<pre><code>from statsmodels.tsa.stattools import adfuller
from statsmodels.tsa.arima.model import ARIMA

# Step 1: 平稳性检验（p<0.05才平稳）
p = adfuller(df['销量'].dropna())[1]
# Step 1b: 不平稳就差分
df['销量_d1'] = df['销量'].diff(1)
# Step 2: 画ACF/PACF确定p,q
# ACF拖尾+PACF截尾→AR(p); 反之→MA(q); 都拖尾→ARIMA
# Step 3: 建模+预测
model = ARIMA(df['销量'].dropna(), order=(2,1,2)).fit()
fc = model.forecast(steps=14)
print(model.summary())  # 看AIC和残差诊断</code></pre>

<h3>3.3 Prophet：傻瓜式但出活快</h3>
<pre><code>from prophet import Prophet
df_p = df.reset_index()[['日期','销量']]
df_p.columns = ['ds','y']
m = Prophet(weekly_seasonality=True, yearly_seasonality=True)
m.add_country_holidays(country_name='CN')  # 加中国节假日
m.fit(df_p)
fc = m.predict(m.make_future_dataframe(periods=30))
m.plot(fc); m.plot_components(fc)  # 趋势+周效应+年效应</code></pre>

<h3>3.4 什么时候用哪个？</h3>
<table><tr><th>场景</th><th>推荐</th></tr>
<tr><td>数据<1年，无明显季节</td><td>ARIMA</td></tr>
<tr><td>数据>1年，有周/年周期</td><td>Prophet</td></tr>
<tr><td>有促销/价格/天气等外部变量</td><td>XGBoost（Day 4）</td></tr></table>

<div class="pit-box"><h4>⚠️ 常见坑</h4><p><strong>ARIMA预测变成一条直线？</strong>→ 可能d设错了，或数据过差分变成白噪声<br>
<strong>Prophet预测完全离谱？</strong>→ 检查是否忘了set_index，ds列名对不对<br>

   cues:["时序→监督学习怎么转换？","XGBoost为什么是表格数据之王？","回测=用历史模拟未来","MAPE/WAPE/RMSE各适合什么场景？"],
   content:`
<h3>4.1 关键转换：时序→监督学习</h3>
<p>机器学习模型不理解时间顺序。<span class="key-pt">你需要手动把历史信息编码成特征。</span></p>
<pre><code>def make_features(df, col):
    data = df.copy()
    for lag in [1,2,3,7,14,28]:
        data[f'lag_{lag}'] = data[col].shift(lag)
    for w in [7,14,30]:
        data[f'rmean_{w}'] = data[col].rolling(w).mean()
        data[f'rstd_{w}'] = data[col].rolling(w).std()
    data['dow'] = data.index.dayofweek
    data['month'] = data.index.month
    data['is_weekend'] = data['dow'].isin([5,6]).astype(int)
    return data.dropna()</code></pre>

<h3>4.2 XGBoost：表格数据王者</h3>
<pre><code>from xgboost import XGBRegressor
from sklearn.model_selection import TimeSeriesSplit

tscv = TimeSeriesSplit(n_splits=5)  # 时序CV，不能用随机KFold！
model = XGBRegressor(n_estimators=200, max_depth=5, learning_rate=0.1,
                     subsample=0.8, reg_alpha=0.1)
for tr_i, te_i in tscv.split(X):
    model.fit(X.iloc[tr_i], y.iloc[tr_i])
    pred = model.predict(X.iloc[te_i])
    mape = np.mean(np.abs((y.iloc[te_i]-pred)/y.iloc[te_i]))*100
    print(f'MAPE: {mape:.1f}%')

# 特征重要性
imp = pd.DataFrame({'f':X.columns,'imp':model.feature_importances_})
print(imp.sort_values('imp',ascending=False).head(10))</code></pre>

<h3>4.3 回测 = 用历史模拟未来</h3>
<table><tr><th>方式</th><th>训练窗口</th><th>适用</th></tr>
<tr><td>滚动窗口</td><td>固定长度（最近90天）→ 预测7天 → 前移7天</td><td>数据模式变化快</td></tr>
<tr><td>扩展窗口</td><td>从始累积 → 预测7天 → 训练集增长</td><td>数据少、模式稳定</td></tr></table>

<h3>4.4 评估指标选哪个？</h3>
<table><tr><th>指标</th><th>适用</th><th>注意</th></tr>
<tr><td>MAPE</td><td>销量>0的常规预测</td><td>销量=0时炸</td></tr>
<tr><td>WAPE</td><td>含零销量SKU</td><td>∑|误差|/∑|实际|</td></tr>
<tr><td>RMSE</td><td>关注大误差</td><td>对大误差惩罚重</td></tr></table>
<blockquote>业务经验：MAPE<15%合格，<10%优秀。大促期间MAPE天然偏高——这是业务规律不是模型问题。</blockquote>

<div class="pit-box"><h4>⚠️ 回测3大坑</h4><p><strong>坑1：用随机KFold</strong>→未来信息泄露，回测结果自欺欺人<br><strong>坑2：忘了扣交易成本/促销成本</strong>→回测收益虚高（量化金融的血泪教训）<br><strong>坑3：只看MAPE不看偏差</strong>→系统性高估10%最后库存积压</p></div>

  {id:21,wk:4,title:"时序→监督学习转换",time:"50 min",lvl:"进阶",

   content:`<pre><code>def make_ts_features(df,target,lags=[1,2,3,7,14,28]):
    d=df.copy()
    for l in lags: d[f'lag_{l}']=d[target].shift(l)
    for w in [7,14,30]:
        d[f'rmean_{w}']=d[target].rolling(w).mean()
        d[f'rstd_{w}']=d[target].rolling(w).std()
    d['dow']=d.index.dayofweek; d['month']=d.index.month
    d['is_weekend']=d['dow'].isin([5,6]).astype(int)
    return d.dropna()</code></pre>

let unlockFailCount = 0;
let unlockLockUntil = 0;

// PBKDF2 从密码派生 AES 密钥
async function deriveKey(password, salt){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:salt,iterations:200000,hash:'SHA-256'},
    keyMaterial,{name:'AES-GCM',length:256},false,['encrypt','decrypt']
  );
}

// AES-GCM 加密：返回 {salt, iv, ciphertext} — 全部Base64
async function encryptApiKey(plaintext, password){
  const enc=new TextEncoder();
  const salt=crypto.getRandomValues(new Uint8Array(16));
  const iv=crypto.getRandomValues(new Uint8Array(12));
  const key=await deriveKey(password, salt);
  const ciphertext=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(plaintext));
  return {
    salt:btoa(String.fromCharCode(...salt)),
    iv:btoa(String.fromCharCode(...iv)),
    ciphertext:btoa(String.fromCharCode(...new Uint8Array(ciphertext)))
  };
}

// AES-GCM 解密
async function decryptApiKey(encrypted, password){
  const salt=new Uint8Array([...atob(encrypted.salt)].map(c=>c.charCodeAt(0)));
  const iv=new Uint8Array([...atob(encrypted.iv)].map(c=>c.charCodeAt(0)));
  const ciphertext=new Uint8Array([...atob(encrypted.ciphertext)].map(c=>c.charCodeAt(0)));
  const key=await deriveKey(password, salt);
  const dec=new TextDecoder();
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ciphertext);
  return dec.decode(plain);
}

// 🔒 加密保存 API Key
async function saveApiKeyEncrypted(){
  const rawKey=document.getElementById('apiKeyInput').value.trim();
  const pwd=document.getElementById('apiPwdInput').value.trim();
  if(!rawKey){toast('请输入 API Key');return;}
  if(!rawKey.startsWith('sk-')){toast('API Key 应以 sk- 开头，请检查');return;}
  if(pwd.length<6){toast('密码至少6位');return;}

  try{
    const enc=await encryptApiKey(rawKey, pwd);
    localStorage.setItem('ql_enc_key',JSON.stringify(enc));
    apiKey=rawKey; // 存入内存
    // 清空输入框
    document.getElementById('apiKeyInput').value='';
    document.getElementById('apiPwdInput').value='';
    document.getElementById('aiSetup').style.display='none';
    updateLockStatus();
    toast('🔒 Key 已 AES-GCM 加密保存（密码不存储）');
    save();
  }catch(e){toast('❌ 加密失败: '+e.message);}
}

// 🔓 解密解锁（页面加载时调用）
async function unlockApiKey(pwdOverride){
  const encStr=localStorage.getItem('ql_enc_key');
  if(!encStr){toast('未找到加密Key，请重新配置');return;}

  // 防暴力破解
  if(unlockLockUntil>0&&Date.now()<unlockLockUntil){
    const remain=Math.ceil((unlockLockUntil-Date.now())/60000);
    toast('⏳ 已锁定，请 '+remain+' 分钟后重试');return;
  }

  const pwd=pwdOverride||document.getElementById('apiUnlockInput').value.trim();
  if(!pwd){toast('请输入解锁密码');return;}

  try{
    const enc=JSON.parse(encStr);
    const plain=await decryptApiKey(enc, pwd);
    apiKey=plain;
    unlockFailCount=0;
    document.getElementById('aiSetup').style.display='none';
    document.getElementById('apiUnlockInput').value='';
    updateLockStatus();
    toast('🔓 已解锁！Key 仅在内存中，关闭页面自动清除');
    save();
  }catch(e){
    unlockFailCount++;
    if(unlockFailCount>=5){
      unlockLockUntil=Date.now()+15*60*1000; // 锁定15分钟
      toast('🚫 密码错误5次，锁定15分钟');
    }else{
      toast('❌ 密码错误 ('+unlockFailCount+'/5)');
    }
  }
}

  const c=document.getElementById('aiMsgs'),d=document.createElement('div');d.className='ai-msg '+role;
  const h=content.replace(/```(\w*)\n([\s\S]*?)```/g,'<pre><code>$2</code></pre>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  d.innerHTML=h+'<div class="msg-time">'+new Date().toLocaleTimeString('zh-CN')+'</div>';c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function askCue(t){document.getElementById('aiInput').value='关于"'+t+'"，请帮我详细解释。';sendAi();}

// ============================================================
// UTILS
// ============================================================
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML;}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2500);}
function setupAutoSave(){setInterval(()=>{saveSummary();save();},30000);window.addEventListener('beforeunload',()=>{saveSummary();save();});}
function resetProgress(){if(confirm('重置所有进度？（笔记和Key保留）')){completed={};ldays=1;lvd='';dayIdx=0;save();updProg();loadDay(0);document.getElementById('dayBadge').textContent='📅 Day 1';toast('已重置');}}
function exportNotes(){
  let md='# 量化分析师成长之路—学习笔记\n\n连续学习：'+ldays+'天 | 完成：'+Object.values(completed).filter(v=>v).length+'\n\n';
  getDays().forEach(d=>{const k=track+':'+d.id;md+='## Day '+(d.id+1)+': '+d.title+'\n状态：'+(completed[k]?'✅':'⏳')+'\n线索：\n';(d.cues.concat(userCues[k]||[])).forEach(c=>md+='- '+c+'\n');md+='总结：'+(userSummaries[k]||'(未写)')+'\n\n---\n\n';});
  const b=new Blob([md],{type:'text/markdown'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='量化笔记_Day'+ldays+'.md';a.click();URL.revokeObjectURL(u);toast('已导出📥');
}
document.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey){
    if(e.key==='Enter'){e.preventDefault();sendAi();}
    if(e.key==='s'){e.preventDefault();saveSummary();toast('已保存');}
    if(e.key==='ArrowRight'&&dayIdx<getDays().length-1){e.preventDefault();loadDay(dayIdx+1);}
    if(e.key==='ArrowLeft'&&dayIdx>0){e.preventDefault();loadDay(dayIdx-1);}
  }
});
document.addEventListener('DOMContentLoaded',()=>{
  init();updProg();
  // 清理旧版明文存储（一次性迁移）
  if(localStorage.getItem('deepseek_key')) localStorage.removeItem('deepseek_key');
  // 检查是否有加密Key，展示对应UI
  const hasEncrypted = !!localStorage.getItem('ql_enc_key');
  if(!apiKey){
    const s=document.getElementById('aiSetup');
    s.style.display='block';
    if(hasEncrypted){
      document.getElementById('aiSetupNew').style.display='none';
      document.getElementById('aiSetupUnlock').style.display='block';
      document.getElementById('aiSetupTitle').textContent='🔐 解锁 API Key';
    } else {
      document.getElementById('aiSetupNew').style.display='block';
      document.getElementById('aiSetupUnlock').style.display='none';
    }
  }
});
</script>
</body>
</html>
